sources:
  - title: "The Book of Involutions"
    authors:
      - "M.-A. Knus"
      - "A. Merkurjev"
      - "M. Rost"
      - "J.-P. Tignol"
    id: "American Mathematical Society Colloquium Publications 44, 1998"
    # READ 2026-11-13 in the 588-page PDF at
    # https://webhomes.maths.ed.ac.uk/~v1ranick/papers/involutions.pdf, a
    # pre-publication typesetting (internal cross-references print as "(??)").
    # The numbers and pages quoted are that file's. The numbering and pages of
    # the printed book are UNCONFIRMED: they were corroborated at five points
    # only ((2.1), (2.6), (2.14), (20.6) and (15.12) of the file carry the
    # content that two later papers cite under those numbers from the 1998
    # book), not at the items cited here. The printed book was not opened.
    # TODO: a stable location for the printed book (publisher's record); the
    # location below is the file that was read.
    type: "book"
    location: "https://webhomes.maths.ed.ac.uk/~v1ranick/papers/involutions.pdf"
    # TODO (author): "adapts" or "independently-proves". "adapts" is used here
    # because the statements of the source are about the Clifford algebra and
    # algebras with involution, and the compared statements are the
    # corresponding statements for the Lie algebra, proved by another route.
    relationship: "adapts"
    note: >-
      Scoped to statements 1, 2(c), 3 and 4. In the numbering of the file
      read: section 7, p. 80, the discriminant of a symmetric bilinear form
      b is the signed determinant disc b = (-1)^{n(n-1)/2} det b in
      F^x/F^{x2}, and it is an invariant of the equivalence class of b
      modulo scalar factors if and only if the dimension is even; (7.3)(3),
      p. 81, for the adjoint involution sigma_b of a nonsingular symmetric
      bilinear form, disc sigma_b = disc b; (8.10) Theorem, p. 94, the
      centre of the Clifford algebra C(A, sigma, f) is an etale quadratic
      F-algebra Z, and if char F != 2 then Z = F[X]/(X^2 - delta) with
      delta a representative of the discriminant; (8.18) Proposition,
      p. 97, for char F != 2 there is a direct sum decomposition
      c(A) = F + c(A)_0 and an isomorphism of Lie algebras from c(A)_0
      onto Alt(A, sigma) = Skew(A, sigma); (13.2) Proposition, p. 173, a
      similitude is proper if and only if it restricts to the identity on
      the centre Z; (15.6) Proposition and (15.7) Theorem, p. 211, the
      equivalence of groupoids A_1^2 = D_2 and Z(Q) =
      F(sqrt(disc(A, sigma, f))) for char F != 2. Statement 1 is the
      corresponding statement for the Lie algebra so(B) = Skew(End V,
      sigma_b) itself: its bracket-commuting maps are a copy of
      F[X]/(X^2 - det B), in dimension four, where the signed determinant
      is the determinant. Statement 4 corresponds to (13.2). The compared
      statements were not located as stated in this source: the word
      "centroid" occurs once in the file (section 32, p. 449, for a
      general algebra) and is not applied to Skew(A, sigma). A derivation
      of statement 1 from these results would also need that the centroid
      is no larger than Z; the results found for that are in the entries
      for Benkart and Neher and for Leijnse, and one step (the centroid of
      a product, for the split case) was not found stated. The proofs here
      do not use this route. Another object of the book is called the
      discriminant algebra ((10.28) Definition, p. 128, for involutions of
      the second kind); the quadratic algebra F[X]/(X^2 - det B) of this
      entry is not given that name here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Varieties admitting a holomorphic symplectic form: LLV algebras and derived equivalences"
    authors:
      - "D. Leijnse"
    id: "arXiv:2605.26398v1"
    # READ 2026-11-13 as arXiv:2605.26398v1 [math.AG], 26 May 2026 (a
    # thesis): Definition 2.4 (p. 11), Lemmas 2.6 and 2.7 (p. 12), Lemma 2.33
    # (p. 20), Theorem 2.34 (pp. 20-21), Theorem 2.36 (pp. 22-23), Remark 2.37
    # (pp. 23-24), Lemma 3.72 (pp. 64-65).
    type: "paper"
    location: "https://arxiv.org/abs/2605.26398"
    relationship: "formalizes"
    note: >-
      Scoped to statement 5, with the context of statement 3. Theorem 2.34
      (pp. 20-21) is given there as "a summary of some results that can be
      found in [Jac62, Chapter X]", for fields of characteristic not 2: the
      derived algebra s(A, sigma) of Skew(A, sigma) (equal to so(B) for
      n >= 3) of type B_l (l >= 1) or D_l (l >= 3) is simple, and "In all
      cases above where s(A (x) l-bar, sigma) is simple, the centroid of
      s(A, sigma) is equal to l". This covers statement 5 in dimension
      three and in dimensions at least five (the types B_l and D_l
      named); in dimensions 0, 1 and 2 the statement is immediate. The
      simplicity claims of that theorem in positive
      characteristic were not checked against a primary source, and the
      proof here does not use them. Theorem 2.36 (pp. 22-23, given there as
      Jacobson, Chapter X, Theorems 11 and 12), for fields of
      characteristic zero, extends an isomorphism of the Lie algebras
      s(A, sigma) and s(B, tau) of two simple algebras with orthogonal
      involution to an isomorphism of the algebras that respects the
      involutions, for types B_l (l >= 2)
      and D_l (l = 3 or l >= 5); with (7.3)(3) of The Book of Involutions
      this gives the conclusion of statement 3 in even dimension 6 and at
      least 10 over a field of characteristic zero (a two-step deduction
      made for this entry, not formalized). That theorem as stated does
      not include type D_2, which is the case of statement 3, proved here
      over every field with 2 != 0 through the bracket-commuting maps.
      Lemma 2.7 (p. 12, given there as "a variant of [Jac62, Chapter X,
      Theorem 3]") is the result found for one step of a derivation of
      statement 1 from the Clifford-side results, in the case where the
      centre is a field (see the entry for The Book of Involutions). Page
      65: over an algebraically closed field, "so_4 = sl_2 x sl_2" (type
      D_2).
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The centroid of extended affine and root graded Lie algebras"
    authors:
      - "G. Benkart"
      - "E. Neher"
    id: "arXiv:math/0502561v1"
    # READ 2026-11-13 as arXiv:math/0502561v1 [math.RT], 26 Feb 2005
    # (sections 1, 2.1, Lemma 2.1, Corollary 2.23, section 3.3). The journal
    # reference is UNCONFIRMED (the arXiv record has none) and is not given.
    type: "paper"
    location: "https://arxiv.org/abs/math/0502561"
    relationship: "background"
    note: >-
      The standard notion. Section 1, p. 1: the centroid of a Lie algebra
      is the space of its module endomorphisms, that is, of the linear
      maps commuting with the adjoint action; this is the set of
      bracket-commuting maps of the definition IsBracketCommuting.
      Section 2.1, pp. 2-3: the centroid of a perfect algebra is
      commutative, and the centroid of a simple algebra is a field (by
      Schur's Lemma). Lemma 2.1(d), p. 4: an algebra is indecomposable if
      and only if its centroid has no idempotents other than 0 and id,
      which is the context of statement 2(c)-(d). Section 3.3, p. 18,
      names type D_2 = A_1 x A_1, the direct sum of two copies of sl_2, as
      an exception. A statement that the centroid of a direct product is
      the product of the centroids was looked for in the file and not
      found. Not used in any proof here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Planes in quadratic 4-space and associated shapes of lattices"
    authors:
      - "M. Aka"
      - "K. Andritsch"
      - "A. Wieser"
    id: "arXiv:2606.03472v2"
    # READ 2026-11-13 as arXiv:2606.03472v2 [math.NT], 17 Aug 2026 (v1 June
    # 2026): sections 2.1-2.2, pp. 8-9, Proposition 2.6.
    type: "paper"
    location: "https://arxiv.org/abs/2606.03472"
    relationship: "background"
    note: >-
      Recorded for what it states about the centre of the even Clifford
      algebra only. Section 2.2, pp. 8-9, for a non-degenerate quaternary
      quadratic space over a field K of characteristic zero: the centre Z
      of the even Clifford algebra has K-basis {1, e_1 e_2 e_3 e_4} for an
      orthogonal basis; (e_1 e_2 e_3 e_4)^2 is equal to disc(Q); if disc(Q)
      is not a square then Z is the quadratic extension K[x]/(x^2 -
      disc(Q)), and if it is a square then Z = K x K, with idempotents
      (1/2)(1 +- e_1 e_2 e_3 e_4 / x). The text calls this "completely
      standard". These are the Clifford-side counterparts of statements 1
      and 2(c). A current paper in which the quadratic algebra of a
      quaternary form is in use. Not used in any proof here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Algebraic Number Theory"
    authors:
      - "J. S. Milne"
    id: "Course notes, version 3.08 (19 July 2020)"
    # READ 2026-11-13 in https://www.jmilne.org/math/CourseNotes/ANT.pdf
    # (v3.08): "Discriminants", p. 33; Proposition 2.40(a), p. 39.
    type: "other"
    location: "https://www.jmilne.org/math/CourseNotes/ANT.pdf"
    relationship: "background"
    note: >-
      Course notes on the author's web page. Scoped to statement 8. P. 33:
      the discriminant of a finite extension is the discriminant of the
      trace form (x, y) -> Tr(x y), and "strictly speaking, disc(K/Q) is
      the element of Q^x/Q^{x2} represented by the integer disc(O_K/Z)";
      Proposition 2.40(a), p. 39: the sign of the discriminant is (-1)^s
      in the notation of the notes. In the Lean proof the
      first fact holds by Mathlib's definition of the discriminant of a
      number field through an integral basis, and the second is Mathlib's
      NumberField.sign_discr.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Number field 4.2.283.1"
    authors:
      - "The LMFDB Collaboration"
    id: "LMFDB, number field 4.2.283.1"
    # READ 2026-11-13: the page https://www.lmfdb.org/NumberField/4.2.283.1.
    type: "other"
    location: "https://www.lmfdb.org/NumberField/4.2.283.1"
    relationship: "background"
    note: >-
      A database page. The number field with defining polynomial
      x^4 - x - 1: degree 4, signature (2, 1), discriminant -283, Galois
      group S_4. The value -283 of statements 9 and 10 is proved in the
      kernel in the author's registered entry PALOMAR-2026-10-21-000012,
      whose library is used here; the page is cited for the reader.
    license: "unknown"
    author_endorsement: "n/a"
