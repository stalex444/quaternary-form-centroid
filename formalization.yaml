status:
  scope: >-
    Formalized: eleven compared theorems, in comparator order, namespace
    QuaternaryCentroid (see the description for their content), on one
    definition carried by the Challenge, IsBracketCommuting. Proved in the
    repository, not compared: the matrix form of statement 1 for a
    symmetric matrix of nonzero determinant on any index type with four
    elements (LorentzLie.exists_hodge_matrix); the explicit operator on
    the skew matrices of a diagonal form with nonzero entries,
    X -> star0 (diagonal eta * X) * diagonal eta, with its square, the
    product of the entries (LorentzLie.FormCentroid.hodge_description);
    for the Lie algebra so' (Fin 4) (Fin 2) over R, that a
    bracket-commuting map is c . id and has determinant c^15
    (LorentzLie.centroid_scalar_so'_four_two); three checks on the
    compared statements (Checks.lean): nondegeneracy cannot be dropped
    from statement 2(c), neither hypothesis on H can be dropped from
    statement 4(c), and the Gram determinant of the trace form of a field
    as in statement 9 is t^2 (-283) in every basis. Further theorems of
    the copied modules (for instance on the trace Gram matrix of
    x^4 - x - 1 as a matrix) are in the repository and are not part of
    this entry's account. Not formalized: the Clifford algebra and the
    relation between H and its central element; automorphisms of so(B)
    other than conjugations by maps preserving B; an isomorphism of so(B)
    with another Lie algebra, over any field (the real Lie algebras of
    statement 10 are isomorphic; not formalized); fields with 2 = 0;
    the integral trace form; any group.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

