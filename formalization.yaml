fidelity:
  divergences: >-
    (a) Object. The sources state their results for the Clifford algebra
    and its centre, or for algebras with involution; the compared
    statements are about the Lie algebra so(B) and its linear
    endomorphisms that commute with the bracket. Neither the Clifford
    algebra nor an algebra with involution occurs in the Lean. (b) The
    determinant. "det B" is the determinant of the Gram matrix of B in a
    chosen basis b (LinearMap.BilinForm.toMatrix b B); it changes by a
    nonzero square with the basis. Statement 1 gives, for each basis, an
    operator H with H(H X) = det_b B . X; for t != 0 the operator t . H
    has the other properties and square t^2 det_b B. What is determined
    is the class of the determinant modulo nonzero squares (statements 2
    and 3). In dimension four the signed determinant of the sources, the
    discriminant (-1)^{n(n-1)/2} det b, is the determinant. (c) Dimension.
    "Dimension four" is stated as: V has a basis indexed by a finite type
    with exactly four elements. In statement 5 the basis is indexed by a
    finite type whose number of elements is not four. (d) Nondegeneracy
    is LinearMap.BilinForm.Nondegenerate; symmetry is
    LinearMap.BilinForm.IsSymm. Control 11(b) shows on the form
    (1, 1, 1, 0) that nondegeneracy cannot be dropped from statement 1;
    for the zero form the bracket-commuting maps are not scalar (not
    proved in the repository). (e) Statement 1(d) and statement 4(c)
    carry the hypothesis that the map is not of the form a . id, and
    statement 4(c) that its square is a scalar; both are needed (the
    checks in Checks.lean). (f) Statement 2(b): the alternative "-1 is a
    square" is the case R = a . id with a^2 = -1. (g) Statement 4 is
    about conjugation by linear maps g with B(g x, g y) = B(x, y); the
    source statement (13.2) is about similitudes of an algebra with
    involution. Automorphisms of so(B) that are not such conjugations are
    not treated. (h) Statement 5 is for so(B) in every finite dimension
    other than four, including dimensions 0, 1 and 2; the source
    statement (Leijnse, Theorem 2.34) is for the derived algebra and the
    types B_l (l >= 1) and D_l (l >= 3). (i) Statement 6 is on Mathlib's
    matrix Lie algebras so' p q R; it is not an instance of statement 5
    as stated (matrices, not endomorphisms). (j) Statement 7 is stated
    for diagonal forms with entries +1 or -1 and selects the two cases by
    the product of the entries; the hypothesis on the entries is not
    needed for the truth of the statement (the product hypothesis makes
    every entry nonzero) and is kept; a form of the statement without it
    was compiled as an option and is not used. It is stated on
    skewAdjointMatricesLieSubalgebra (Matrix.diagonal eta), not on so' p q
    R. (k) Statement 8: the discriminant is Mathlib's NumberField.discr K,
    an integer, read in Q; clause (c) is on the real matrices skew for
    the trace matrix of Mathlib's integral basis, read in R, not on the
    real span of the field. (l) Statements 9 and 10 take a number field
    of degree four and an element theta with theta^4 = theta + 1 as
    hypotheses; nothing is carried for the polynomial. The degree
    hypothesis is needed in statement 9: a field of larger degree
    containing such an element has only the bracket-commuting maps
    c . id. Control 11(a) shows that the hypotheses can be met. (m)
    Statement 10 compares two Lie algebras over Q and says nothing about
    any group; over R both Lie algebras have a bracket-commuting map of
    square -1 (statements 9(c) and 7(a)), and the entry does not state
    that they are isomorphic over R. (n) Sources. The Book of Involutions
    was read in a pre-publication PDF, and its printed numbering was not
    confirmed; Leijnse, Benkart and Neher, and Aka, Andritsch and Wieser
    were read in their arXiv versions; Milne's notes in version 3.08;
    Jacobson's Lie Algebras was not read.

