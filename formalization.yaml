        for a larger unpublished development of the author's and are
        copied from it; the first of them is copied without two sections,
        and docstrings of three others had working labels removed (see
        BUILD.txt). The compared statements restate the library's
        theorems in other forms; three of them (statement 4, statement 2(c)-(d)
        and statement 7(b)) have proofs for a general form that were
        written with the compared statements, on 2026-11-13
