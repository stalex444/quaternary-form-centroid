version: "v0.4"

project:
  name: "Bracket-commuting maps (the centroid) of the orthogonal Lie algebra of a quaternary form: the quadratic algebra F[X]/(X^2 - det B) and the square class of the determinant"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of eleven statements about
    the bracket-commuting maps (the centroid) of the Lie algebra so(B) of
    the B-skew-adjoint endomorphisms, for a nondegenerate symmetric
    bilinear form B on a finite-dimensional vector space over a field F
    with 2 != 0. A linear map R : so(B) -> so(B) is bracket-commuting when
    R[X, Y] = [X, R Y] for all X, Y. The general theorem, in dimension
    four: (1) there is a bracket-commuting H with H(H X) = det B . X such
    that every bracket-commuting map is a . id + c . H for exactly one
    pair (a, c), and a bracket-commuting map that is not of the form
    a . id and has the same square is H or -H; so the bracket-commuting
    maps are a copy of the quadratic algebra F[X]/(X^2 - det B). Here
    det B is the determinant of the Gram matrix in a chosen basis; for
    t != 0 the operator t . H has square t^2 det B, and what is determined
    is the class of det B modulo nonzero squares. (2) A bracket-commuting
    map, not of the form a . id, with square c exists if and only if
    c = t^2 det B for some t != 0; a bracket-commuting map (of the form
    a . id or not) with square -1 exists if and only if -det B or -1 is a
    square; a bracket-commuting idempotent other
    than 0 and id exists if and only if det B is a square, and then there
    are exactly two, P and id - P. (3) If so(B) and so(B') are isomorphic Lie
    algebras, then det B' = t^2 det B for some t != 0. (4) If g is a
    linear map preserving B, then det g = +1 or -1, conjugation by g is a
    Lie algebra equivalence phi of so(B), and phi H phi^{-1} = det g . H
    for every bracket-commuting H, not of the form a . id, whose square
    is a scalar; a map preserving B with determinant -1 exists. Other
    dimensions: (5) in every finite dimension other than four every
    bracket-commuting map of so(B) is c . id; (6) an example of the same
    fact on Mathlib's matrix Lie algebras so' p q R with
    card p + card q != 4. Corollaries and examples: (7) over R, for a
    diagonal form with entries +1 or -1 in dimension four, the
    bracket-commuting maps are a . id + c . J with J(J X) = -X (a copy of
    C) when the product of the entries is -1, and a . P + c . (id - P)
    for an idempotent P other than 0 and id (a copy of R x R) when the
    product is 1; (8) for a number field K of degree four with its trace
    form (x, y) -> Tr_{K/Q}(x y): over Q, H(H X) = d_K . X with d_K the
    discriminant of K, and a rational bracket-commuting map of square -1
    exists if and only if -d_K is a rational square; over R, on the trace
    matrix of an integral basis, H(H X) = (-1)^{r_2} . X with r_2 the
    number of complex places; (9) the example x^4 - x - 1: for a number
    field K of degree four containing theta with theta^4 = theta + 1,
    H(H X) = (-283) . X, no rational bracket-commuting map has square -1,
    and over R one exists; (10) for the same K, the Lie algebra over Q of
    the trace form of K is not isomorphic to the Lie algebra over Q of
    the diagonal form (1, 1, 1, -1), which does have a rational
    bracket-commuting map of square -1 (the classes of the determinants
    modulo rational squares are those of -283 and -1). (11) Controls: a
    number field as in (9) and (10) exists; for the degenerate diagonal
    form (1, 1, 1, 0) over Q every bracket-commuting map is c . id; the
    clause "not of the form a . id" cannot be dropped from (2). The
    Challenge imports Mathlib only and carries one definition
    (IsBracketCommuting). This entry is a formalization; nothing in it is
    claimed as original mathematics. The ingredients are classical: on
    the side of the Clifford algebra, the quadratic algebra of (1) is the
    centre of the even Clifford algebra, F[X]/(X^2 - delta) with delta a
    representative of the discriminant (Knus, Merkurjev, Rost, Tignol,
    The Book of Involutions, (8.10) and (15.7), in the numbering of a
    pre-publication PDF), and (4) corresponds to (13.2) there; (5), in
    dimension three and in dimensions at least five, is stated in
    Leijnse, arXiv:2605.26398, Theorem 2.34, as a summary of results of
    Jacobson (not read for this entry). The statements (1)-(4) and the
    rational clauses of (8), for the Lie algebra itself, were not located
    as stated in the sources read; (1) follows in two steps from
    Chaktoura and Szechtman, J. Lie Theory 23 (2013), Theorem
    (so(B) = so(B|W) (x) F[X]/(X^2 - det B)), and Benkart and Neher,
    Corollary 2.23(b). Prior formalization, recorded under
    related_formalizations: the Clifford-algebra side (the centre of the
    even Clifford algebra as K[X]/(X^2 - d) with the square criterion,
    and in dimension four the even Clifford algebra and the Spin group
    over that centre) is formalized in TauCetiProject/TauCeti; the
    existence clauses of (1) and of the second case of (7), and the case
    det g = 1 of (4), are formalized for the real definite form, in
    coordinates, in openai/math; the
    discriminant -283 of the field of x^4 - x - 1 is taken from the
    author's registered entry PALOMAR-2026-10-21-000012. In a dated
    search no formalization was found of a description of the
    bracket-commuting maps of an orthogonal Lie algebra apart from the
    library of the author's registered entry PALOMAR-2026-11-14-000019
    (the same development; proved there, not compared), and no
    declaration named for the centroid of a Lie algebra (the maps are
    those underlying Mathlib's LieModuleHom from L to L). Scope: fields with 2 = 0 are excluded; (4) treats only the
    automorphisms of so(B) that are conjugation by a linear map
    preserving B; no isomorphism of so(B) with another Lie algebra is
    stated; (9) and (10) are about the trace form of the field and the
    Lie algebra of the endomorphisms skew-adjoint for it.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # MSC2020 codes, all in the registry's snapshot (PalomarSubmission,
  # taxonomies/msc2020-codes.json, at 14aa8d6b): 17B05 (structure theory for
  # Lie algebras), 17B40 (automorphisms, derivations, other operators for Lie
  # algebras), 17B20 (simple, semisimple, reductive algebras), 11E04
  # (quadratic forms over general fields), 11E88 (quadratic spaces; Clifford
  # algebras), 16W10 (rings with involution; Lie, Jordan and other
  # nonassociative structures), 11R16 (cubic and quartic extensions), 11R29
  # (class numbers, class groups, discriminants). The field takes at most
  # eight; 15A63 (quadratic and bilinear forms, inner products) was dropped as
  # the least specific of nine candidates. arXiv: math.RA (Lie algebras as
  # nonassociative algebras; quadratic forms and algebras with involution) and
  # math.NT (the trace form and the discriminant of a number field), and
  # math.RT (the maps are the endomorphisms of the adjoint module; Benkart and
  # Neher is in math.RT). All three are in the registry's arXiv snapshot at the
  # same commit.
  arxiv: ["math.RA", "math.NT", "math.RT"]
  msc2020: ["17B05", "17B40", "17B20", "11E04", "11E88", "16W10", "11R16", "11R29"]

sources:
  - title: "The Book of Involutions"
    authors:
      - "Max-Albert Knus"
      - "Alexander Merkurjev"
      - "Markus Rost"
      - "Jean-Pierre Tignol"
    id: "American Mathematical Society Colloquium Publications 44, 1998"
    # Bibliographic record Crossref-verified 2026-11-13: DOI 10.1090/coll/044
    # (title, the four authors, Colloquium Publications, American Mathematical
    # Society, 1998). READ 2026-11-13 in the 588-page PDF at
    # https://webhomes.maths.ed.ac.uk/~v1ranick/papers/involutions.pdf, a
    # pre-publication typesetting (internal cross-references print as "(??)").
    # The numbers and pages quoted are that file's. On 2026-11-13 the numbering and pages of
    # the printed book were UNCONFIRMED: they were corroborated at five points
    # only ((2.1), (2.6), (2.14), (20.6) and (15.12) of the file carry the
    # content that two later papers cite under those numbers from the 1998
    # book), not at the items cited here. The printed book was not opened.
    # The section pages agree with the printed table of contents and the authors' error list places (7.3) on p. 81 (Rost's page for the book, read 2026-11-14); the other item numbers cited remain unconfirmed.
    type: "book"
    location: "https://doi.org/10.1090/coll/044"
    # Relationship "adapts": the compared statements are the Lie-algebra counterparts of the source's Clifford-side results and were not located in it as stated; the proofs here do not follow its route.
    relationship: "adapts"
    note: >-
      Scoped to statements 1, 2(c), 3 and 4. The source states the result
      on the side of the Clifford algebra and of algebras with involution;
      the compared statements are the corresponding statements for the Lie
      algebra, proved here by computation with matrices and not by the
      route of the source. In the numbering of the file read (a
      pre-publication PDF, https://webhomes.maths.ed.ac.uk/~v1ranick/papers/involutions.pdf):
      section 7, p. 80, the discriminant of a symmetric bilinear form
      b is the signed determinant disc b = (-1)^{n(n-1)/2} det b in
      F^x/F^{x2}, and it is an invariant of the equivalence class of b
      modulo scalar factors if and only if the dimension is even; (7.3)(3),
      p. 81, for the adjoint involution sigma_b of a nonsingular symmetric
      bilinear form, disc sigma_b = disc b; (8.10) Theorem, p. 94, the
      centre of the Clifford algebra C(A, sigma, f) is an etale quadratic
      F-algebra Z, and if char F != 2 then Z = F[X]/(X^2 - delta) with
      delta a representative of the discriminant; (8.18) Proposition,
      p. 97, for char F != 2 there is a direct sum decomposition
      c(A) = F + c(A)_0 and an isomorphism of Lie algebras from c(A)_0
      onto Alt(A, sigma) = Skew(A, sigma); (13.2) Proposition, p. 173, a
      similitude is proper if and only if the automorphism it induces on
      the Clifford algebra is the identity on the centre Z; (15.6) Proposition and (15.7) Theorem, p. 211, the
      equivalence of groupoids A_1^2 = D_2 and Z(Q) =
      F(sqrt(disc(A, sigma, f))) for char F != 2. Statement 1 is the
      corresponding statement for the Lie algebra so(B) = Skew(End V,
      sigma_b) itself: its bracket-commuting maps are a copy of
      F[X]/(X^2 - det B), in dimension four, where the signed determinant
      is the determinant. Statement 4 corresponds to (13.2). The compared
      statements were not located as stated in this source: the word
      "centroid" occurs once in the file (section 32, p. 449, for a
      general algebra) and is not applied to Skew(A, sigma). A derivation
      of statement 1 from these results would also need that the centroid
      is no larger than Z; the results found for that are in the entries
      for Benkart and Neher (Lemma 2.1(a) for the split case) and for
      Leijnse. A shorter derivation, at the level of the Lie algebra, is in
      the entries for Chaktoura and Szechtman and for Benkart and Neher
      (Corollary 2.23(b)). Another object of the book is called the
      discriminant algebra ((10.28) Definition, p. 128, for involutions of
      the second kind); the quadratic algebra F[X]/(X^2 - det B) of this
      entry is not given that name here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Varieties admitting a holomorphic symplectic form: LLV algebras and derived equivalences"
    authors:
      - "Dion Leijnse"
    id: "arXiv:2605.26398v1"
    # Title and author as in the arXiv record (read through the arXiv API,
    # 2026-11-13). READ 2026-11-13 as arXiv:2605.26398v1 [math.AG], 26 May
    # 2026 (a thesis): Definition 2.4 (p. 11), Lemmas 2.6 and 2.7 (p. 12), Lemma 2.33
    # (p. 20), Theorem 2.34 (pp. 20-21), Theorem 2.36 (pp. 22-23), Remark 2.37
    # (pp. 23-24), Lemma 3.72 (pp. 64-65).
    type: "paper"
    location: "https://arxiv.org/abs/2605.26398"
    relationship: "formalizes"
    note: >-
      Scoped to statement 5, with the context of statement 3. Statement 5
      is the result this source states; the proof here is a computation
      with matrices and was not written from this text. Theorem 2.34
      (pp. 20-21) is given there as "a summary of some results that can be
      found in [Jac62, Chapter X]", for fields of characteristic not 2: the
      derived algebra s(A, sigma) of Skew(A, sigma) (equal to so(B) for
      n >= 3) of type B_l (l >= 1) or D_l (l >= 3) is simple, and "In all
      cases above where s(A (x) l-bar, sigma) is simple, the centroid of
      s(A, sigma) is equal to l". This covers statement 5 in dimension
      three and in dimensions at least five (the types B_l and D_l
      named); in dimensions 0, 1 and 2 the statement is immediate. The
      simplicity claims of that theorem in positive
      characteristic were not checked against a primary source, and the
      proof here does not use them. Theorem 2.36 (pp. 22-23, given there as
      Jacobson, Chapter X, Theorems 11 and 12), for fields of
      characteristic zero, extends an isomorphism of the Lie algebras
      s(A, sigma) and s(B, tau) of two simple algebras with orthogonal
      involution to an isomorphism of the algebras that respects the
      involutions, for types B_l (l >= 2)
      and D_l (l = 3 or l >= 5); with (7.3)(3) of The Book of Involutions
      this gives the conclusion of statement 3 in even dimension 6 and at
      least 10 over a field of characteristic zero (a two-step deduction
      made for this entry, not formalized). That theorem as stated does
      not include type D_2, which is the case of statement 3, proved here
      over every field with 2 != 0 through the bracket-commuting maps.
      Lemma 2.7 (p. 12, given there as "a variant of [Jac62, Chapter X,
      Theorem 3]") is the result found for one step of a derivation of
      statement 1 from the Clifford-side results, in the case where the
      centre is a field (see the entry for The Book of Involutions). Page
      65: over an algebraically closed field, "so_4 = sl_2 x sl_2" (type
      D_2).
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The centroid of extended affine and root graded Lie algebras"
    authors:
      - "Georgia Benkart"
      - "Erhard Neher"
    id: "arXiv:math/0502561v1"
    # Title and authors as in the arXiv record (arXiv API, 2026-11-13). READ
    # 2026-11-13 as arXiv:math/0502561v1 [math.RT], 26 Feb 2005 (sections 1,
    # 2.1, Lemma 2.1, Corollary 2.23, section 3.3). The arXiv record carries
    # no journal reference. Crossref (2026-11-13) has an article of the same
    # title and authors: Journal of Pure and Applied Algebra 205 (2006), no. 1,
    # 117-145, DOI 10.1016/j.jpaa.2005.06.007. The journal version was not
    # opened; sections and pages quoted are those of the arXiv version.
    type: "paper"
    location: "https://arxiv.org/abs/math/0502561"
    relationship: "background"
    note: >-
      The standard notion. Section 1, p. 1: the centroid of a Lie algebra
      is the space of its module endomorphisms, that is, of the linear
      maps commuting with the adjoint action; this is the set of
      bracket-commuting maps of the definition IsBracketCommuting.
      Section 2.1, pp. 2-3: the centroid of a perfect algebra is
      commutative, and the centroid of a simple algebra is a field (by
      Schur's Lemma). Lemma 2.1(d), p. 4: an algebra is indecomposable if
      and only if its centroid has no idempotents other than 0 and id,
      which is the context of statement 2(c)-(d). Section 3.3, p. 18,
      names type D_2 = A_1 x A_1, the direct sum of two copies of sl_2, as
      an exception. Lemma 2.1(a), p. 3: any perfect ideal is invariant
      under the centroid, from which the centroid of a product of two
      perfect algebras is the product of the centroids; the proof of Lemma
      2.1 refers to Ponomarev (Algebra Logic 40 (2001), Lemma 1) for the
      centroid of a decomposable algebra (read in the Russian original,
      Algebra i Logika 40:6 (2001) 651-674, p. 655: Lemma 1, attributed to
      Melville, Gamma(R1 + R2) = Gamma(R1) + Gamma(R2) + C(R1, R2), C(R1, R2)
      mapping each factor into the other's annihilator; English translation
      not opened). Corollary 2.23(b),
      pp. 11-12: for a perfect A with Cent(A) = F id and a unital B,
      Cent(A (x) B) = id (x) Cent(B); with the theorem of Chaktoura and
      Szechtman this gives statement 1. Not used in any proof here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A note on orthogonal Lie algebras in dimension 4 viewed as current Lie algebras"
    authors:
      - "Martin Chaktoura"
      - "Fernando Szechtman"
    id: "arXiv:1306.4006v1"
    # Journal: J. Lie Theory 23 (2013), no. 4, 1101-1103, doi:10.5802/jolt.767
    # (Crossref, checked 2026-11-14). READ 2026-11-14 in the arXiv version and in the journal version (open access, Centre Mersenne); same text.
    type: "paper"
    location: "https://arxiv.org/abs/1306.4006"
    relationship: "adapts"
    note: >-
      Scoped to statements 1 and 2(c). Theorem (p. 1; journal p. 1101, unnumbered): for a non-degenerate symmetric
      bilinear form f on a four-dimensional space with Gram determinant D,
      M = [L(f), L(f)] (= L(f) = so(f) when char F != 2) is isomorphic to
      [L(f|W), L(f|W)] (x) F[X]/(X^2 - D) for a three-dimensional W on
      which f is non-degenerate. With Benkart and Neher, Corollary 2.23(b),
      this gives the description of statement 1. The note also reports
      (Bourbaki, Lie Groups and Lie Algebras, Ch. I, section 6, Exercise
      26; seen only in search-inside snippets of the 1975 English edition, p. 109, not saved) that for char F != 2, M is the sum of two
      three-dimensional simple ideals or simple according as D is or is not
      a square (context of statement 2(c)). The proof here is a computation
      with matrices and was not written from this text.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Planes in quadratic 4-space and associated shapes of lattices"
    authors:
      - "Menny Aka"
      - "Konstantin Andritsch"
      - "Andreas Wieser"
    id: "arXiv:2606.03472v2"
    # Title and authors as in the arXiv record (arXiv API, 2026-11-13). READ
    # 2026-11-13 as arXiv:2606.03472v2 [math.NT], 17 Aug 2026 (v1 June
    # 2026): sections 2.1-2.2, pp. 8-9, Proposition 2.6.
    type: "paper"
    location: "https://arxiv.org/abs/2606.03472"
    relationship: "background"
    note: >-
      Recorded for what it states about the centre of the even Clifford
      algebra only. Section 2.2, pp. 8-9, for a non-degenerate quaternary
      quadratic space over a field K of characteristic zero: the centre Z
      of the even Clifford algebra has K-basis {1, e_1 e_2 e_3 e_4} for an
      orthogonal basis; (e_1 e_2 e_3 e_4)^2 is equal to disc(Q); if disc(Q)
      is not a square then Z is the quadratic extension K[x]/(x^2 -
      disc(Q)), and if it is a square then Z = K x K, with idempotents
      (1/2)(1 +- e_1 e_2 e_3 e_4 / x). The text calls this "completely
      standard". These are the Clifford-side counterparts of statements 1
      and 2(c). A current paper in which the quadratic algebra of a
      quaternary form is in use. Not used in any proof here.
    license: "unknown"
    author_endorsement: "not-contacted"
