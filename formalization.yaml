fidelity:
  divergences: >-
    (a) Object. The sources state their results for the Clifford algebra
    and its centre, or for algebras with involution; the compared
    statements are about the Lie algebra so(B) and its linear
    endomorphisms that commute with the bracket. Neither the Clifford
    algebra nor an algebra with involution occurs in the Lean. (b) The
    determinant. "det B" is the determinant of the Gram matrix of B in a
    chosen basis b (LinearMap.BilinForm.toMatrix b B); it changes by a
    nonzero square with the basis. Statement 1 gives, for each basis, an
    operator H with H(H X) = det_b B . X; for t != 0 the operator t . H
    has the other properties and square t^2 det_b B. What is determined
    is the class of the determinant modulo nonzero squares (statements 2
    and 3). In dimension four the signed determinant of the sources, the
    discriminant (-1)^{n(n-1)/2} det b, is the determinant. (c) Dimension.
    "Dimension four" is stated as: V has a basis indexed by a finite type
    with exactly four elements. In statement 5 the basis is indexed by a
    finite type whose number of elements is not four. (d) Nondegeneracy
    is LinearMap.BilinForm.Nondegenerate; symmetry is
    LinearMap.BilinForm.IsSymm. Control 11(b) shows on the form
    (1, 1, 1, 0) that nondegeneracy cannot be dropped from statement 1;
    for the zero form the bracket-commuting maps are not scalar (not
    proved in the repository). (e) Statement 1(d) and statement 4(c)
    carry the hypothesis that the map is not of the form a . id, and
    statement 4(c) that its square is a scalar; both are needed in 4(c)
    (the checks in Checks.lean); in 1(d) the clause is needed exactly when
    det B is a square (for (1, 1, 1, 1) the identity has square det B and
    is neither H nor -H; not formalized). (f) Statement 2(b): the alternative "-1 is a
    square" is the case R = a . id with a^2 = -1. (g) Statement 4 is
    about conjugation by linear maps g with B(g x, g y) = B(x, y); the
    source statement (13.2) is about similitudes of an algebra with
    involution. Automorphisms of so(B) that are not such conjugations are
    not treated. (h) Statement 5 is for so(B) in every finite dimension
    other than four, including dimensions 0, 1 and 2; the source
    statement (Leijnse, Theorem 2.34) is for the derived algebra and the
    types B_l (l >= 1) and D_l (l >= 3). (i) Statement 6 is on Mathlib's
    matrix Lie algebras so' p q R; it is not an instance of statement 5
    as stated (matrices, not endomorphisms). (j) Statement 7 is stated
    for diagonal forms with entries +1 or -1 and selects the two cases by
    the product of the entries; the hypothesis on the entries is not
    needed for the truth of the statement (the product hypothesis makes
    every entry nonzero) and is kept. It is stated on
    skewAdjointMatricesLieSubalgebra (Matrix.diagonal eta), not on so' p q
    R. (k) Statement 8: the discriminant is Mathlib's NumberField.discr K,
    an integer, read in Q; clause (c) is on the real matrices skew for
    the trace matrix of Mathlib's integral basis, read in R, not on the
    real span of the field. (l) Statements 9 and 10 take a number field
    of degree four and an element theta with theta^4 = theta + 1 as
    hypotheses; nothing is carried for the polynomial. The degree
    hypothesis is needed in statement 9: a field of larger degree
    containing such an element has only the bracket-commuting maps
    c . id. Control 11(a) shows that the hypotheses can be met. (m)
    Statement 10 compares two Lie algebras over Q and says nothing about
    any group; over R the two forms are isometric (both of signature (3, 1);
    for the trace form, PALOMAR-2026-10-21-000012, traceForm_signature),
    so the two real Lie algebras are isomorphic, which is not formalized
    here; both have a bracket-commuting map of square -1 (statements 9(c)
    and 7(a)). (n) Sources. Leijnse, Benkart and Neher, and Aka, Andritsch and Wieser
    were read in their arXiv versions; Milne's notes in version 3.08;
    Jacobson's Lie Algebras was not read page by page (search-inside snippets only); Chaktoura and Szechtman were read in both versions; Ponomarev's Lemma 1 in the Russian original. (o) Carriers. Statements 1-5,
    8(a)-(b), 9(a)-(b) and the first Lie algebra of 10(a) are on Mathlib's
    skewAdjointLieSubalgebra B (endomorphisms); statements 6, 7, 8(c),
    9(c), 10(b), the second Lie algebra of 10(a), and 11(b)-(c) are on
    skewAdjointMatricesLieSubalgebra G (matrices). The two are
    Lie-equivalent through the matrix of an endomorphism in a basis
    (LorentzLie.FormCentroid.skewAdjointEquivMatrices, in the repository,
    not compared); where a matrix statement is described as a case of, or
    a control for, statements 1 and 2, it is so through that equivalence.

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
    - "AI-assisted review sessions (Anthropic Claude, in Claude Code), separate from the sessions that wrote the Lean, under the author's direction"
  notes: >-
    The axioms of every compared declaration were printed, the Challenge
    and Solution statements and the definition were checked identical by
    script and by a structural hash of the elaborated terms, and the
    registry Comparator was run locally (BUILD.txt). An AI-assisted
    hypothesis-deleting review of the eleven statements (Anthropic Claude,
    in Claude Code, under the author's direction), with compiled probe
    files and an independent exact computation over the rational numbers,
    quadratic fields and finite fields, found all eleven true, none
    vacuous, and each matching its docstring; its prose corrections were
    applied, and the hypotheses it found deletable or weakenable in truth
    were kept: the hypothesis on the entries in statement 7 (fidelity,
    (j)); in statement 3 the nondegeneracy of the two forms and one of the
    two cardinality hypotheses; in statement 4 the cardinality hypothesis,
    which could be "at least one element"; in statement 10 the degree
    hypothesis (README.md, "Scope"). After the assembly, a further AI-assisted pass removed
    two unused sections and working labels from copied modules, shortened
    the opening docstring of the Challenge and completed this metadata;
    it changed no compared statement, definition or proof, which was
    checked by the same structural hash, by a hash of the type and the
    value of every declaration of the copied libraries before and after,
    and by a second run of the Comparator (BUILD.txt). The reports of
    these reviews, of the search for prior formalizations and sources and
    of the sessions that wrote the Lean are working records of the
    author's project and are not part of this repository; where this file
    or README.md gives an account of the search or of contact with
    another development, it is the author's account from those records.
    The author reviewed statements 1-11 against their informal descriptions on 2026-11-14; they are unchanged since. Not peer-reviewed.

alignment:
  namespace: "QuaternaryCentroid"
  statements:
    - source: "Not located as stated in the sources read; follows in two steps from Chaktoura-Szechtman, J. Lie Theory 23 (2013), Theorem, and Benkart-Neher, Corollary 2.23(b). Clifford-side counterpart: Knus-Merkurjev-Rost-Tignol 1998, (8.10) and (15.7) (numbering of a pre-publication PDF), with (7.3)(3) and (8.18); Aka-Andritsch-Wieser, arXiv:2606.03472v2, section 2.2"
      lean: "QuaternaryCentroid.centroid_of_dim_four"
      module: "Solution"
      status: "proved"
      note: "For a field with 2 != 0 and a symmetric nondegenerate form B on a space with a basis of four elements: a bracket-commuting H on so(B) with H(H X) = det B . X, such that every bracket-commuting map is a . id + c . H for exactly one pair (a, c); a bracket-commuting map not of the form a . id with the same square is H or -H."
    - source: "Not located as stated in the sources read; arithmetic in the quadratic algebra of statement 1. Clifford-side counterpart of clause (c): Knus-Merkurjev-Rost-Tignol 1998, (8.10) (numbering of a pre-publication PDF); Aka-Andritsch-Wieser, section 2.2 (the idempotents). Context of clauses (c)-(d): Benkart-Neher, Lemma 2.1(d). The decomposition behind clause (c) (so(B) is the sum of two three-dimensional simple ideals or simple according as det B is or is not a square): Bourbaki, Lie Groups and Lie Algebras, Ch. I, section 6, Exercise 26(b), as reported by Chaktoura-Szechtman, J. Lie Theory 23 (2013), p. 1101"
      lean: "QuaternaryCentroid.sq_and_idempotent_iff"
      module: "Solution"
      status: "proved"
      note: "Same hypotheses: (a) a bracket-commuting map not of the form a . id with square c exists iff c = t^2 det B, t != 0; (b) a bracket-commuting map (of the form a . id or not) with square -1 exists if and only if -det B or -1 is a square; (c) a bracket-commuting idempotent other than 0 and id exists iff det B is a square; (d) two such idempotents P, Q satisfy Q = P or Q = id - P."
    - source: "Not located as stated for dimension four in the sources read. Nearest stated result: Leijnse, arXiv:2605.26398v1, Theorem 2.36 (given there as Jacobson, Chapter X, Theorems 11 and 12; characteristic zero; type D_2 not included), with Knus-Merkurjev-Rost-Tignol 1998, (7.3)(3) (numbering of a pre-publication PDF)"
      lean: "QuaternaryCentroid.det_eq_sq_mul_of_lieEquiv"
      module: "Solution"
      status: "proved"
      note: "Two forms as in statement 1 on spaces with bases of four elements: if so(B) and so(B') are Lie-equivalent over F, then det B' = t^2 det B for some t != 0."
    - source: "Not located as stated for the Lie algebra in the sources read. Clifford-side counterpart: Knus-Merkurjev-Rost-Tignol 1998, (13.2) (numbering of a pre-publication PDF)"
      lean: "QuaternaryCentroid.isometry_conj_eq_det_smul"
      module: "Solution"
      status: "proved"
      note: "For every linear g preserving B: det g is 1 or -1; conjugation by g is a Lie algebra equivalence phi of so(B); for every bracket-commuting H, not of the form a . id, with scalar square, phi H phi^{-1} = det g . H. A map preserving B of determinant -1 exists."
    - source: "Leijnse, arXiv:2605.26398v1, Theorem 2.34 (given there as a summary of results of Jacobson, Lie Algebras, Chapter X; characteristic not 2; the derived algebra, types B_l with l >= 1 and D_l with l >= 3). Dimensions 0, 1 and 2 are immediate"
      lean: "QuaternaryCentroid.centroid_scalar_of_dim_ne_four"
      module: "Solution"
      status: "proved"
      note: "For a field with 2 != 0 and a symmetric nondegenerate form on a space with a basis indexed by a finite type whose number of elements is not four: every bracket-commuting map of so(B) is c . id."
    - source: "The fact of statement 5 on Mathlib's matrix Lie algebras so' p q R; not an instance of statement 5 as stated (matrices, not endomorphisms)"
      lean: "QuaternaryCentroid.centroid_scalar_so'"
      module: "Solution"
      status: "proved"
      note: "For finite types p, q with card p + card q != 4, every bracket-commuting real-linear map of LieAlgebra.Orthogonal.so' p q R is c . id."
    - source: "Statements 1 and 2 over the real numbers, where the class of the determinant modulo squares is its sign; not located as stated in the sources read. Nearest stated result for clause (a) at signature (3, 1): Voight, Quaternion Algebras (author's PDF v.1.0.7u), section 36.3, p. 658, the isomorphism of Lie algebras so_{3,1} = sl_{2,C}"
      lean: "QuaternaryCentroid.centroid_real_diagonal"
      module: "Solution"
      status: "proved"
      note: "For a real diagonal form with entries 1 or -1 in dimension four: if the product of the entries is -1, the bracket-commuting maps are a . id + c . J with J(J X) = -X; if it is 1, they are a . P + c . (id - P) for a bracket-commuting idempotent P other than 0 and id."
    - source: "Statements 1 and 2 on the trace form; that its discriminant is the discriminant of the field, and the sign (-1)^{r_2}: Milne, Algebraic Number Theory, v3.08, p. 33 and Proposition 2.40(a). The rational clauses were not located as stated in the sources read"
      lean: "QuaternaryCentroid.centroid_traceForm"
      module: "Solution"
      status: "proved"
      note: "For a number field K of degree four with its trace form: over Q, H(H X) = d_K . X with the unique decomposition; a rational bracket-commuting map of square -1 exists iff -d_K is a rational square; over R, on the trace matrix of an integral basis, H(H X) = (-1)^{r_2} . X with the unique decomposition."
    - source: "Example of statement 8. The discriminant -283 of the field of x^4 - x - 1: LMFDB 4.2.283.1; proved in the registered entry PALOMAR-2026-10-21-000012"
      lean: "QuaternaryCentroid.centroid_traceForm_of_root"
      module: "Solution"
      status: "proved"
      note: "For a number field K of degree four containing theta with theta^4 = theta + 1: H(H X) = (-283) . X with the unique decomposition; no rational bracket-commuting map has square -1; over R one exists."
    - source: "Example of statements 2(b) and 3"
      lean: "QuaternaryCentroid.not_lieEquiv_diagonal_of_root"
      module: "Solution"
      status: "proved"
      note: "For the same K: there is no Lie algebra equivalence over Q from the skew-adjoint endomorphisms of the trace form of K to the rational matrices skew for diag(1, 1, 1, -1); the latter has a rational bracket-commuting map of square -1."
    - source: "Controls; not source statements"
      lean: "QuaternaryCentroid.controls"
      module: "Solution"
      status: "proved"
      note: "(a) A number field of degree four with an element theta, theta^4 = theta + 1, exists. (b) For diag(1, 1, 1, 0) over Q every bracket-commuting map is c . id. (c) On the rational matrices skew for diag(1, 1, 1, -1) the identity is bracket-commuting with square 1, and 1 is not t^2 (-1) for a rational t != 0."

