project:
  # TODO (author): the title. This is the statement stage's working title.
  name: "Bracket-commuting maps of the orthogonal Lie algebra of a quaternary form: the quadratic algebra F[X]/(X^2 - det B), the square class of the determinant, and the trace form of a number field of degree four"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of eleven statements about
    the bracket-commuting maps (the centroid) of the Lie algebra so(B) of
    the B-skew-adjoint endomorphisms, for a nondegenerate symmetric
    bilinear form B on a finite-dimensional vector space over a field F
    with 2 != 0. A linear map R : so(B) -> so(B) is bracket-commuting when
    R[X, Y] = [X, R Y] for all X, Y. The general theorem, in dimension
    four: (1) there is a bracket-commuting H with H(H X) = det B . X such
    that every bracket-commuting map is a . id + b . H for exactly one
    pair (a, b), and a bracket-commuting map that is not of the form
    a . id and has the same square is H or -H; so the bracket-commuting
    maps are a copy of the quadratic algebra F[X]/(X^2 - det B). Here
    det B is the determinant of the Gram matrix in a chosen basis; for
    t != 0 the operator t . H has square t^2 det B, and what is determined
    is the class of det B modulo nonzero squares. (2) A bracket-commuting
    map, not of the form a . id, with square c exists if and only if
    c = t^2 det B for some t != 0; one with square -1 exists if and only
    if -det B or -1 is a square; a bracket-commuting idempotent other
    than 0 and id exists if and only if det B is a square, and there are
    at most two, P and id - P. (3) If so(B) and so(B') are isomorphic Lie
    algebras, then det B' = t^2 det B for some t != 0. (4) If g is a
    linear map preserving B, then det g = +1 or -1, conjugation by g is a
    Lie algebra equivalence phi of so(B), and phi H phi^{-1} = det g . H
    for every bracket-commuting H, not of the form a . id, whose square
    is a scalar; a map preserving B with determinant -1 exists. Other
    dimensions: (5) in every finite dimension other than four every
    bracket-commuting map of so(B) is c . id; (6) an example of the same
    fact on Mathlib's matrix Lie algebras so' p q R with
    card p + card q != 4. Corollaries and examples: (7) over R, for a
    diagonal form with entries +1 or -1 in dimension four, the
    bracket-commuting maps are a . id + b . J with J(J X) = -X (a copy of
    C) when the product of the entries is -1, and a . P + c . (id - P)
    for an idempotent P other than 0 and id (a copy of R x R) when the
    product is 1; (8) for a number field K of degree four with its trace
    form (x, y) -> Tr_{K/Q}(x y): over Q, H(H X) = d_K . X with d_K the
    discriminant of K, and a rational bracket-commuting map of square -1
    exists if and only if -d_K is a rational square; over R, on the trace
    matrix of an integral basis, H(H X) = (-1)^{r_2} . X with r_2 the
    number of complex places; (9) the example x^4 - x - 1: for a number
    field K of degree four containing theta with theta^4 = theta + 1,
    H(H X) = (-283) . X, no rational bracket-commuting map has square -1,
    and over R one exists; (10) for the same K, the Lie algebra over Q of
    the trace form of K is not isomorphic to the Lie algebra over Q of
    the diagonal form (1, 1, 1, -1), which does have a rational
    bracket-commuting map of square -1 (the classes of the determinants
    modulo rational squares are those of -283 and -1). (11) Controls: a
    number field as in (9) and (10) exists; for the degenerate diagonal
    form (1, 1, 1, 0) over Q every bracket-commuting map is c . id; the
    clause "not of the form a . id" cannot be dropped from (2). The
    Challenge imports Mathlib only and carries one definition
    (IsBracketCommuting). This entry is a formalization; nothing in it is
    claimed as original mathematics. The ingredients are classical: on
    the side of the Clifford algebra, the quadratic algebra of (1) is the
    centre of the even Clifford algebra, F[X]/(X^2 - delta) with delta a
    representative of the discriminant (Knus, Merkurjev, Rost, Tignol,
    The Book of Involutions, (8.10) and (15.7), in the numbering of a
    pre-publication PDF), and (4) corresponds to (13.2) there; (5), in
    dimension three and in dimensions at least five, is stated in
    Leijnse, arXiv:2605.26398, Theorem 2.34, as a summary of results of
    Jacobson (not read for this entry). The statements (1)-(4) and the
    rational clauses of (8), for the Lie algebra itself, were not located
    as stated in the sources read. Prior formalization, recorded under
    related_formalizations: the Clifford-algebra side (the centre of the
    even Clifford algebra as K[X]/(X^2 - d) with the square criterion,
    and in dimension four the even Clifford algebra and the Spin group
    over that centre) is formalized in TauCetiProject/TauCeti; the real
    definite instance is formalized in coordinates in openai/math; the
    discriminant -283 of the field of x^4 - x - 1 is taken from the
    author's registered entry PALOMAR-2026-10-21-000012. In a dated
    search no formalization was found of a centroid of a Lie algebra or
    of a description of the bracket-commuting maps of an orthogonal Lie
    algebra. Scope: fields with 2 = 0 are excluded; (4) treats only the
    automorphisms of so(B) that are conjugation by a linear map
    preserving B; no isomorphism of so(B) with another Lie algebra is
    stated; (9) and (10) are about the trace form of the field and the
    Lie algebra of the endomorphisms skew-adjoint for it, and nothing is
    stated about any other algebra or group attached to the field.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

